<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit Customer' : 'Add Customer'">Customer | Courier CMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand"><span class="brand-icon">🚚</span><h2>Courier CMS</h2><p>Management System</p></div>
        <nav class="sidebar-nav">
            <span class="nav-section-label">Main</span>
            <a th:href="@{/dashboard}" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
            <span class="nav-section-label">Modules</span>
            <a th:href="@{/office}" class="nav-item"><span class="nav-icon">🏢</span> Offices</a>
            <a th:href="@{/manager}" class="nav-item"><span class="nav-icon">👔</span> Managers</a>
            <a th:href="@{/customer}" class="nav-item active"><span class="nav-icon">👥</span> Customers</a>
            <a th:href="@{/shipment}" class="nav-item"><span class="nav-icon">📦</span> Shipments</a>
            <a th:href="@{/delivery}" class="nav-item"><span class="nav-icon">🛵</span> Deliveries</a>
            <a th:href="@{/payment}" class="nav-item"><span class="nav-icon">💳</span> Payments</a>
            <span class="nav-section-label">Tools</span>
            <a th:href="@{/shipment/track}" class="nav-item"><span class="nav-icon">🔍</span> Track Shipment</a>
        </nav>
        <div class="sidebar-footer"><a th:href="@{/logout}" class="nav-item" style="color:#f87171;"><span class="nav-icon">🚪</span> Logout</a></div>
    </aside>
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-title">
                <h1 th:text="${editMode} ? '✏️ Edit Customer' : '➕ Register Customer'">Customer</h1>
                <p>Fill in customer details</p>
            </div>
            <div class="topbar-right"><div class="topbar-user"><div class="avatar">A</div><span>Admin</span></div></div>
        </header>
        <main class="page-content">
            <div class="page-header"><div></div><a th:href="@{/customer}" class="btn btn-secondary">← Back to Customers</a></div>
            <div class="card" style="max-width: 700px;">
                <div class="card-header"><h2 th:text="${editMode} ? 'Edit Customer' : 'New Customer'">Form</h2></div>
                <div class="card-body">
                    <form th:action="${editMode} ? @{/customer/edit/{id}(id=${customer.id})} : @{/customer/add}"
                          th:object="${customer}" method="post" id="customer-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="fullName">Full Name *</label>
                                <input type="text" id="fullName" th:field="*{fullName}" placeholder="Enter full name">
                                <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number *</label>
                                <input type="tel" id="phone" th:field="*{phone}" placeholder="10-digit number" maxlength="10">
                                <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" th:field="*{email}" placeholder="customer@example.com">
                                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                            </div>
                            <div class="form-group full-width">
                                <label for="address">Address *</label>
                                <input type="text" id="address" th:field="*{address}" placeholder="Full address">
                                <span class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                            </div>
                        </div>
                        <div style="margin-top: 1.5rem; display:flex; gap:0.75rem;">
                            <button type="submit" class="btn btn-primary" id="btn-submit-customer"
                                    th:text="${editMode} ? '💾 Update Customer' : '➕ Register Customer'">Submit</button>
                            <a th:href="@{/customer}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
