<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" th:content="${pageDescription ?: 'Online Courier Management System - Admin Panel'}">
    <title th:text="${pageTitle != null ? pageTitle + ' | SwachhSathi Courier' : 'Online Courier Management System'}">
        Online Courier Management System
    </title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">🚚</span>
            <h2>Courier CMS</h2>
            <p>Management System</p>
        </div>

        <nav class="sidebar-nav">
            <span class="nav-section-label">Main</span>
            <a th:href="@{/dashboard}" class="nav-item" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                <span class="nav-icon">🏠</span> Dashboard
            </a>

            <span class="nav-section-label">Modules</span>
            <a th:href="@{/office}" class="nav-item" th:classappend="${activePage == 'office' ? 'active' : ''}">
                <span class="nav-icon">🏢</span> Offices
            </a>
            <a th:href="@{/manager}" class="nav-item" th:classappend="${activePage == 'manager' ? 'active' : ''}">
                <span class="nav-icon">👔</span> Managers
            </a>
            <a th:href="@{/customer}" class="nav-item" th:classappend="${activePage == 'customer' ? 'active' : ''}">
                <span class="nav-icon">👥</span> Customers
            </a>
            <a th:href="@{/shipment}" class="nav-item" th:classappend="${activePage == 'shipment' ? 'active' : ''}">
                <span class="nav-icon">📦</span> Shipments
            </a>
            <a th:href="@{/delivery}" class="nav-item" th:classappend="${activePage == 'delivery' ? 'active' : ''}">
                <span class="nav-icon">🛵</span> Deliveries
            </a>
            <a th:href="@{/payment}" class="nav-item" th:classappend="${activePage == 'payment' ? 'active' : ''}">
                <span class="nav-icon">💳</span> Payments
            </a>

            <span class="nav-section-label">Tools</span>
            <a th:href="@{/shipment/track}" class="nav-item" th:classappend="${activePage == 'track' ? 'active' : ''}">
                <span class="nav-icon">🔍</span> Track Shipment
            </a>
        </nav>

        <div class="sidebar-footer">
            <a th:href="@{/logout}" class="nav-item" style="color: #f87171;">
                <span class="nav-icon">🚪</span> Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-title">
                <h1 th:text="${pageTitle ?: 'Dashboard'}">Dashboard</h1>
                <p th:text="${pageSubtitle ?: 'Online Courier Management System'}">Online Courier Management System</p>
            </div>
            <div class="topbar-right">
                <div class="topbar-user">
                    <div class="avatar">A</div>
                    <span>Admin</span>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="page-content" th:fragment="content">
            <!-- Page content goes here -->
        </main>

    </div>
</div>
</body>
</html>
