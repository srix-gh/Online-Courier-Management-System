<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin login for Online Courier Management System">
    <title>Login | Online Courier Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <span class="icon">🚚</span>
            <h1>Courier CMS</h1>
            <p>Online Courier Management System</p>
        </div>

        <!-- Flash message from logout -->
        <div th:if="${message}" class="alert alert-success">
            ✅ <span th:text="${message}"></span>
        </div>

        <!-- Error message -->
        <div th:if="${error}" class="alert alert-danger">
            ⚠️ <span th:text="${error}"></span>
        </div>

        <form method="post" th:action="@{/login}" id="login-form">
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username"
                       required autocomplete="username">
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password"
                       required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary" id="login-btn"
                    style="width:100%; justify-content: center; padding: 0.75rem;">
                🔐 Sign In
            </button>
        </form>

        <p style="text-align:center; margin-top:1.5rem; font-size:0.75rem; color: var(--gray-400);">
            Demo credentials: <strong>admin</strong> / <strong>admin123</strong>
        </p>
    </div>
</div>
</body>
</html>
