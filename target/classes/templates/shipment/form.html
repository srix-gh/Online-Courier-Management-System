<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit Shipment' : 'New Shipment'">Shipment | Courier CMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand"><span class="brand-icon">🚚</span><h2>Courier CMS</h2><p>Management System</p></div>
        <nav class="sidebar-nav">
            <span class="nav-section-label">Main</span>
            <a th:href="@{/dashboard}" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
            <span class="nav-section-label">Modules</span>
            <a th:href="@{/office}" class="nav-item"><span class="nav-icon">🏢</span> Offices</a>
            <a th:href="@{/manager}" class="nav-item"><span class="nav-icon">👔</span> Managers</a>
            <a th:href="@{/customer}" class="nav-item"><span class="nav-icon">👥</span> Customers</a>
            <a th:href="@{/shipment}" class="nav-item active"><span class="nav-icon">📦</span> Shipments</a>
            <a th:href="@{/delivery}" class="nav-item"><span class="nav-icon">🛵</span> Deliveries</a>
            <a th:href="@{/payment}" class="nav-item"><span class="nav-icon">💳</span> Payments</a>
            <span class="nav-section-label">Tools</span>
            <a th:href="@{/shipment/track}" class="nav-item"><span class="nav-icon">🔍</span> Track Shipment</a>
        </nav>
        <div class="sidebar-footer"><a th:href="@{/logout}" class="nav-item" style="color:#f87171;"><span class="nav-icon">🚪</span> Logout</a></div>
    </aside>
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-title">
                <h1 th:text="${editMode} ? '✏️ Edit Shipment' : '➕ New Shipment'">Shipment</h1>
                <p th:if="${editMode}" th:text="'Tracking: ' + ${shipment.trackingNumber}"></p>
                <p th:unless="${editMode}">Fill in shipment details. Tracking number will be auto-generated.</p>
            </div>
            <div class="topbar-right"><div class="topbar-user"><div class="avatar">A</div><span>Admin</span></div></div>
        </header>
        <main class="page-content">
            <div class="page-header"><div></div><a th:href="@{/shipment}" class="btn btn-secondary">← Back to Shipments</a></div>
            <div class="card" style="max-width: 900px;">
                <div class="card-header"><h2 th:text="${editMode} ? 'Edit Shipment Details' : 'Create New Shipment'">Form</h2></div>
                <div class="card-body">
                    <form th:action="${editMode} ? @{/shipment/edit/{id}(id=${shipment.id})} : @{/shipment/add}"
                          th:object="${shipment}" method="post" id="shipment-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="customerId">Customer *</label>
                                <select id="customerId" name="customerId">
                                    <option value="">-- Select Customer --</option>
                                    <option th:each="c : ${customers}"
                                            th:value="${c.id}"
                                            th:text="${c.fullName + ' (' + c.phone + ')'}"
                                            th:selected="${shipment.customer != null && shipment.customer.id == c.id}">
                                    </option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="sourceOfficeId">Source Office *</label>
                                <select id="sourceOfficeId" name="sourceOfficeId">
                                    <option value="">-- Select Office --</option>
                                    <option th:each="o : ${offices}"
                                            th:value="${o.id}"
                                            th:text="${o.officeName + ' - ' + o.city}"
                                            th:selected="${shipment.sourceOffice != null && shipment.sourceOffice.id == o.id}">
                                    </option>
                                </select>
                            </div>
                            <div class="form-group full-width">
                                <label for="destinationAddress">Destination Address *</label>
                                <input type="text" id="destinationAddress" th:field="*{destinationAddress}" placeholder="Full delivery address">
                                <span class="field-error" th:if="${#fields.hasErrors('destinationAddress')}" th:errors="*{destinationAddress}"></span>
                            </div>
                            <div class="form-group">
                                <label for="shipmentDate">Shipment Date *</label>
                                <input type="date" id="shipmentDate" th:field="*{shipmentDate}">
                            </div>
                            <div class="form-group">
                                <label for="weight">Weight (kg) *</label>
                                <input type="number" id="weight" th:field="*{weight}" step="0.1" min="0.1" placeholder="e.g. 2.5">
                                <span class="field-error" th:if="${#fields.hasErrors('weight')}" th:errors="*{weight}"></span>
                            </div>
                            <div class="form-group">
                                <label for="courierCharge">Courier Charge (₹) *</label>
                                <input type="number" id="courierCharge" th:field="*{courierCharge}" step="0.01" min="1" placeholder="e.g. 350.00">
                                <span class="field-error" th:if="${#fields.hasErrors('courierCharge')}" th:errors="*{courierCharge}"></span>
                            </div>
                            <div class="form-group" th:if="${editMode}">
                                <label for="status">Shipment Status</label>
                                <select id="status" th:field="*{status}">
                                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                                </select>
                            </div>
                        </div>
                        <div style="margin-top: 1.5rem; display:flex; gap:0.75rem;">
                            <button type="submit" class="btn btn-primary" id="btn-submit-shipment"
                                    th:text="${editMode} ? '💾 Update Shipment' : '📦 Create Shipment'">Submit</button>
                            <a th:href="@{/shipment}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
