<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit Manager' : 'Add Manager'">Manager | Courier CMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand"><span class="brand-icon">🚚</span><h2>Courier CMS</h2><p>Management System</p></div>
        <nav class="sidebar-nav">
            <span class="nav-section-label">Main</span>
            <a th:href="@{/dashboard}" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
            <span class="nav-section-label">Modules</span>
            <a th:href="@{/office}" class="nav-item"><span class="nav-icon">🏢</span> Offices</a>
            <a th:href="@{/manager}" class="nav-item active"><span class="nav-icon">👔</span> Managers</a>
            <a th:href="@{/customer}" class="nav-item"><span class="nav-icon">👥</span> Customers</a>
            <a th:href="@{/shipment}" class="nav-item"><span class="nav-icon">📦</span> Shipments</a>
            <a th:href="@{/delivery}" class="nav-item"><span class="nav-icon">🛵</span> Deliveries</a>
            <a th:href="@{/payment}" class="nav-item"><span class="nav-icon">💳</span> Payments</a>
            <span class="nav-section-label">Tools</span>
            <a th:href="@{/shipment/track}" class="nav-item"><span class="nav-icon">🔍</span> Track Shipment</a>
        </nav>
        <div class="sidebar-footer"><a th:href="@{/logout}" class="nav-item" style="color:#f87171;"><span class="nav-icon">🚪</span> Logout</a></div>
    </aside>
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-title">
                <h1 th:text="${editMode} ? '✏️ Edit Manager' : '➕ Add Manager'">Manager</h1>
                <p>Fill in manager details and assign an office</p>
            </div>
            <div class="topbar-right"><div class="topbar-user"><div class="avatar">A</div><span>Admin</span></div></div>
        </header>
        <main class="page-content">
            <div class="page-header"><div></div><a th:href="@{/manager}" class="btn btn-secondary">← Back to Managers</a></div>
            <div class="card" style="max-width: 700px;">
                <div class="card-header"><h2 th:text="${editMode} ? 'Edit Manager' : 'New Manager'">Form</h2></div>
                <div class="card-body">
                    <form th:action="${editMode} ? @{/manager/edit/{id}(id=${manager.id})} : @{/manager/add}"
                          th:object="${manager}" method="post" id="manager-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="managerName">Manager Name *</label>
                                <input type="text" id="managerName" th:field="*{managerName}" placeholder="Full name">
                                <span class="field-error" th:if="${#fields.hasErrors('managerName')}" th:errors="*{managerName}"></span>
                            </div>
                            <div class="form-group">
                                <label for="contactNumber">Contact Number *</label>
                                <input type="tel" id="contactNumber" th:field="*{contactNumber}" placeholder="10-digit number" maxlength="10">
                                <span class="field-error" th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}"></span>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" th:field="*{email}" placeholder="manager@example.com">
                                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                            </div>
                            <div class="form-group">
                                <label for="officeId">Assigned Office *</label>
                                <select id="officeId" name="officeId">
                                    <option value="">-- Select Office --</option>
                                    <option th:each="o : ${offices}"
                                            th:value="${o.id}"
                                            th:text="${o.officeName + ' - ' + o.city}"
                                            th:selected="${manager.assignedOffice != null && manager.assignedOffice.id == o.id}">
                                    </option>
                                </select>
                            </div>
                        </div>
                        <div style="margin-top: 1.5rem; display:flex; gap:0.75rem;">
                            <button type="submit" class="btn btn-primary" id="btn-submit-manager"
                                    th:text="${editMode} ? '💾 Update Manager' : '➕ Add Manager'">Submit</button>
                            <a th:href="@{/manager}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
