<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit Office | Courier CMS' : 'Add Office | Courier CMS'">Office | Courier CMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand"><span class="brand-icon">🚚</span><h2>Courier CMS</h2><p>Management System</p></div>
        <nav class="sidebar-nav">
            <span class="nav-section-label">Main</span>
            <a th:href="@{/dashboard}" class="nav-item"><span class="nav-icon">🏠</span> Dashboard</a>
            <span class="nav-section-label">Modules</span>
            <a th:href="@{/office}" class="nav-item active"><span class="nav-icon">🏢</span> Offices</a>
            <a th:href="@{/manager}" class="nav-item"><span class="nav-icon">👔</span> Managers</a>
            <a th:href="@{/customer}" class="nav-item"><span class="nav-icon">👥</span> Customers</a>
            <a th:href="@{/shipment}" class="nav-item"><span class="nav-icon">📦</span> Shipments</a>
            <a th:href="@{/delivery}" class="nav-item"><span class="nav-icon">🛵</span> Deliveries</a>
            <a th:href="@{/payment}" class="nav-item"><span class="nav-icon">💳</span> Payments</a>
            <span class="nav-section-label">Tools</span>
            <a th:href="@{/shipment/track}" class="nav-item"><span class="nav-icon">🔍</span> Track Shipment</a>
        </nav>
        <div class="sidebar-footer"><a th:href="@{/logout}" class="nav-item" style="color:#f87171;"><span class="nav-icon">🚪</span> Logout</a></div>
    </aside>
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-title">
                <h1 th:text="${editMode} ? '✏️ Edit Office' : '➕ Add Office'">Add Office</h1>
                <p>Fill in the office details below</p>
            </div>
            <div class="topbar-right"><div class="topbar-user"><div class="avatar">A</div><span>Admin</span></div></div>
        </header>
        <main class="page-content">
            <div class="page-header">
                <div></div>
                <a th:href="@{/office}" class="btn btn-secondary">← Back to Offices</a>
            </div>

            <div class="card" style="max-width: 700px;">
                <div class="card-header">
                    <h2 th:text="${editMode} ? 'Edit Office Details' : 'New Office'">Office Form</h2>
                </div>
                <div class="card-body">
                    <form th:action="${editMode} ? @{/office/edit/{id}(id=${office.id})} : @{/office/add}"
                          th:object="${office}" method="post" id="office-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="officeName">Office Name *</label>
                                <input type="text" id="officeName" th:field="*{officeName}" placeholder="e.g. Mumbai Central">
                                <span class="field-error" th:if="${#fields.hasErrors('officeName')}" th:errors="*{officeName}"></span>
                            </div>
                            <div class="form-group">
                                <label for="city">City *</label>
                                <input type="text" id="city" th:field="*{city}" placeholder="e.g. Mumbai">
                                <span class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></span>
                            </div>
                            <div class="form-group full-width">
                                <label for="address">Address *</label>
                                <input type="text" id="address" th:field="*{address}" placeholder="Street address">
                                <span class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                            </div>
                            <div class="form-group">
                                <label for="contactNumber">Contact Number *</label>
                                <input type="tel" id="contactNumber" th:field="*{contactNumber}" placeholder="10-digit number" maxlength="10">
                                <span class="field-error" th:if="${#fields.hasErrors('contactNumber')}" th:errors="*{contactNumber}"></span>
                            </div>
                        </div>
                        <div style="margin-top: 1.5rem; display:flex; gap:0.75rem;">
                            <button type="submit" class="btn btn-primary" id="btn-submit-office">
                                <span th:text="${editMode} ? '💾 Update Office' : '➕ Add Office'">Submit</span>
                            </button>
                            <a th:href="@{/office}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
